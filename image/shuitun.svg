  <ellipse cx="62" cy="116" rx="10" ry="6" fill="#F43F5E" fill-opacity="0.25"/>
  <ellipse cx="138" cy="116" rx="10" ry="6" fill="#F43F5E" fill-opacity="0.25"/>

